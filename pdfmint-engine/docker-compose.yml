services:
  pdfmint-engine:
    build: .
    container_name: pdfmint-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_BYTES: "104857600"
      JOB_TIMEOUT_SECONDS: "180"
      ALLOWED_ORIGINS: "https://pdfbreeze.net,https://www.pdfbreeze.net,http://localhost:5500,http://127.0.0.1:5500"
      PORT: "8000"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
