<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signing in to PDFMint</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css?v=5410"></head><body class="auth-page"><main class="auth-shell"><a class="auth-brand" href="index.html"><span>P</span><b>PDF<span>Mint</span></b></a><section class="auth-card auth-copy"><p class="eyebrow">SECURE SIGN IN</p><h1>Opening your workspace…</h1><p data-callback-message>Please wait while we confirm your account.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js?v=5410"></script><script>
(async function(){const message=document.querySelector('[data-callback-message]');try{if(!PDFMintAuth.configured)throw new Error('PDFMint account services have not been configured yet.');const code=new URLSearchParams(location.search).get('code');if(code){const result=await PDFMintAuth.client.auth.exchangeCodeForSession(code);if(result.error)throw result.error;}const user=await PDFMintAuth.getUser();if(!user)throw new Error('The sign-in link is invalid or has expired.');const target=sessionStorage.getItem('pdfmintAuthReturnTo')||PDFMINT_CONFIG.dashboardPath||'/dashboard.html';sessionStorage.removeItem('pdfmintAuthReturnTo');location.replace(target);}catch(error){message.textContent=PDFMintAuth.messageFor(error);message.classList.add('error');setTimeout(()=>location.replace('/login.html'),2600);}})();
  </script></body></html>
