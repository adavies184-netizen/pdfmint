<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Choose a new PDFBreeze password."><title>Reset your PDFBreeze password</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css?v=5400"></head><body class="auth-page"><main class="auth-shell"><a class="auth-brand" href="index.html"><span>P</span><b>PDF<span>Breeze</span></b></a><section class="auth-card"><div class="auth-copy"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Choose a new password</h1><p>Use at least 8 characters and one number.</p></div><form class="auth-form" data-password-form><label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><p class="auth-message" data-password-message aria-live="polite"></p><button class="primary-auth-button" type="submit"><span>Update password</span><span>›</span></button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js?v=5400"></script><script>
(function(){const form=document.querySelector('[data-password-form]'),message=document.querySelector('[data-password-message]');form.addEventListener('submit',async event=>{event.preventDefault();const password=form.elements.password.value;if(!/\d/.test(password)){message.textContent='Add at least one number.';message.classList.add('error');return;}if(password!==form.elements.confirm.value){message.textContent='The passwords do not match.';message.classList.add('error');return;}const button=form.querySelector('button');button.disabled=true;try{await PDFMintAuth.updatePassword(password);message.textContent='Password updated. Opening your workspace…';message.classList.remove('error');setTimeout(()=>location.replace('/dashboard.html'),900);}catch(error){message.textContent=PDFMintAuth.messageFor(error);message.classList.add('error');button.disabled=false;}});})();
  </script></body></html>
