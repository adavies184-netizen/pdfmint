<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>PDFBreeze Next Editor</title>
  <link rel="stylesheet" href="embedpdf-poc.css?v=hybrid-1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="PDFBreeze home"><span class="brand-mark">P</span><span>PDFBreeze</span></a>
    <span class="test-badge">Next editor preview</span>
    <div class="top-actions">
      <button id="open-another" class="button button-secondary" type="button" hidden>Open another PDF</button>
      <button id="download-pdf" class="button button-primary" type="button" hidden>Download PDF</button>
    </div>
  </header>
  <main>
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <div class="welcome-card">
        <div class="test-icon" aria-hidden="true">PDF</div>
        <p class="eyebrow">PDFBREEZE NEXT EDITOR</p>
        <h1 id="welcome-title">Open a PDF</h1>
        <p class="intro">View, add text, draw, sign and download your PDF in the new PDFBreeze editor.</p>
        <label id="drop-zone" class="drop-zone" for="pdf-input">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <strong>Choose a PDF</strong>
          <span>or drag and drop it here</span>
          <input id="pdf-input" type="file" accept="application/pdf,.pdf">
        </label>
        <p class="privacy-note"><span aria-hidden="true">✓</span> During this preview, your file stays in this browser and is not added to My Account.</p>
        <p id="welcome-error" class="error" role="alert" hidden></p>
      </div>
    </section>
    <section id="workspace" class="workspace" hidden>
      <div class="file-strip">
        <div><span class="file-label">Editing</span><strong id="file-name">Document.pdf</strong></div>
        <div id="status" class="status" role="status"><span class="spinner" aria-hidden="true"></span>Loading editor…</div>
      </div>
      <nav class="quick-tools" aria-label="PDFBreeze quick tools">
        <span class="quick-tools-label">Quick tools</span>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-text" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v14m-4 0h8"/></svg><span>Add Text</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:insert" data-embed-command="insert:add-signature" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c3-5 4-9 6-9 3 0-2 9 1 9 2 0 3-4 4-4 1 0 0 4 2 4 1 0 2-1 3-2M4 20h16"/></svg><span>Sign</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:insert" data-embed-command="insert:add-image" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 4"/></svg><span>Image</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-ink" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4-1 11-11-3-3L5 16l-1 4ZM14 7l3 3M4 20h16"/></svg><span>Draw</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-highlight" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 7-10 5 4-7 10H6v-4ZM4 21h16"/></svg><span>Highlight</span>
        </button>
      </nav>
      <div id="pdf-viewer" class="viewer" aria-label="PDF editor"></div>
    </section>
  </main>
  <script type="module" src="embedpdf-poc.js?v=hybrid-1"></script>
</body>
</html>
