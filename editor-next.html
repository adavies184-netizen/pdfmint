<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>PDFBreeze Next Editor</title>
  <link rel="stylesheet" href="embedpdf-poc.css?v=combined-16">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="PDFBreeze home"><span class="brand-mark">P</span><span>PDFBreeze</span></a>
    <span class="test-badge">Next editor preview</span>
    <div class="header-document" title="Currently open document"><span class="file-label">Editing</span><strong id="file-name">Document.pdf</strong></div>
    <div class="top-actions">
      <button id="open-another" class="button button-secondary" type="button" hidden>Open another PDF</button>
      <button id="download-pdf" class="button button-primary" type="button" hidden>Download PDF</button>
    </div>
  </header>
  <main>
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <div class="welcome-card">
        <div class="test-icon" aria-hidden="true">PDF</div>
        <p class="eyebrow">PDFBREEZE NEXT EDITOR</p>
        <h1 id="welcome-title">Open a PDF</h1>
        <p class="intro">View, add text, draw, sign and download your PDF in the new PDFBreeze editor.</p>
        <label id="drop-zone" class="drop-zone" for="pdf-input">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <strong>Choose a PDF</strong>
          <span>or drag and drop it here</span>
          <input id="pdf-input" type="file" accept="application/pdf,.pdf">
        </label>
        <p class="privacy-note"><span aria-hidden="true">✓</span> During this preview, your file stays in this browser and is not added to My Account.</p>
        <p id="welcome-error" class="error" role="alert" hidden></p>
      </div>
    </section>
    <section id="workspace" class="workspace" hidden>
      <nav class="quick-tools" aria-label="PDFBreeze quick tools">
        <span class="quick-tools-label">Quick tools</span>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-text" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v14m-4 0h8"/></svg><span>Add Text</span>
        </button>
        <button class="quick-tool pending-tool" type="button" data-pending-tool="PDFium text editing" aria-pressed="false" aria-disabled="true" title="Coming with the PDFium integration">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h10M10 5v14M6 19h8M15 14l5-5 2 2-5 5-3 1 1-3Z"/></svg><span>Edit Text</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:insert" data-embed-command="insert:add-signature" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c3-5 4-9 6-9 3 0-2 9 1 9 2 0 3-4 4-4 1 0 0 4 2 4 1 0 2-1 3-2M4 20h16"/></svg><span>Sign</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:insert" data-embed-command="insert:add-image" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 4"/></svg><span>Image</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-ink" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4-1 11-11-3-3L5 16l-1 4ZM14 7l3 3M4 20h16"/></svg><span>Draw</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-highlight" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 7-10 5 4-7 10H6v-4ZM4 21h16"/></svg><span>Highlight</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-link" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></svg><span>Link</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:annotate" data-embed-command="annotation:add-comment" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v13H9l-4 3V4Zm4 5h6M9 12h4"/></svg><span>Note</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:insert" data-embed-command="insert:add-rubber-stamp" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14h10l2 4H5l2-4Zm3-1V9a3 3 0 1 1 6 0v4M5 21h14"/></svg><span>Stamp</span>
        </button>
        <button class="quick-tool pending-tool" type="button" data-pending-tool="Watermark" aria-pressed="false" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6 6 11a6 6 0 0 1-12 0c0-5 6-11 6-11Z"/></svg><span>Watermark</span>
        </button>
        <button class="quick-tool pending-tool" type="button" data-pending-tool="Crop" aria-pressed="false" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v14h14M3 7h14v14"/></svg><span>Crop</span>
        </button>
        <button class="quick-tool" type="button" data-embed-mode="mode:shapes" data-embed-command="annotation:add-line" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"/></svg><span>Line</span>
        </button>
        <button class="quick-tool pending-tool" type="button" data-pending-tool="Manage pages" aria-pressed="false" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>Manage</span>
        </button>
      </nav>
      <div id="add-text-options" class="add-text-options" hidden aria-label="Add text options">
        <label class="text-option colour-option"><span class="colour-preview colour-preview-font"></span><input id="add-text-colour" type="color" value="#111827"><small>Font color</small></label>
        <label class="text-option colour-option"><span class="colour-preview colour-preview-fill"></span><input id="add-text-fill" type="color" value="#ffffff"><small>Fill colour</small></label>
        <label class="text-option opacity-option"><span>Opacity</span><input id="add-text-opacity" type="range" min="20" max="100" value="100"><output>100%</output></label>
        <label class="text-option font-option"><span>Font</span><select id="add-text-font"><option value="helvetica">Helvetica</option><option value="times-roman">Times Roman</option><option value="courier">Courier</option></select></label>
        <label class="text-option size-option"><span>Size</span><input id="add-text-size" type="number" min="8" max="96" value="18"></label>
        <div class="alignment-options" role="group" aria-label="Text alignment"><button class="alignment-option active" type="button" data-align="left" title="Align left">☰</button><button class="alignment-option" type="button" data-align="center" title="Align centre">☷</button><button class="alignment-option" type="button" data-align="right" title="Align right">≡</button></div>
      </div>
      <div id="status" class="status sr-only" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>Loading editor…</div>
      <div id="pdf-viewer" class="viewer" aria-label="PDF editor"></div>
    </section>
  </main>
  <script type="module" src="embedpdf-poc.js?v=combined-16"></script>
</body>
</html>
